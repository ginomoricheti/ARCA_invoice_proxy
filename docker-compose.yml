version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: arca-invoice-proxy-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arca_proxy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arca-invoice-proxy-api
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/arca_proxy?sslmode=disable"
      ARCA_ENVIRONMENT: "homologation"
      ARCA_WSAA_URL: "https://wsaa.homo.afip.gov.ar/ws/services/LoginCms"
      ARCA_WSFE_URL: "https://servicios1.afip.gov.ar/wsfev1/service.asmx"
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
      API_KEY_PEPPER: "change-me-in-production"
      IDEMPOTENCY_TTL: "24h"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: